<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>Edvora — нет сети</title>
    <style>
      :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; color: #0f172a; background: #f8fafc; }
      body { min-height: 100vh; min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(100%, 420px); padding: 28px; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 28px; background: white; box-shadow: 0 20px 60px rgb(15 23 42 / 0.12); }
      h1 { margin: 0 0 12px; font-size: 1.5rem; }
      p { margin: 0; line-height: 1.55; color: #475569; }
      button { width: 100%; min-height: 48px; margin-top: 22px; border: 0; border-radius: 16px; color: white; background: #2563eb; font: inherit; font-weight: 700; touch-action: manipulation; }
    </style>
  </head>
  <body>
    <main>
      <h1>Сейчас нет сети</h1>
      <p>Если урок уже открывался на этом устройстве, вернитесь назад и продолжайте. Иначе подключитесь к интернету и повторите попытку.</p>
      <button type="button" onclick="location.reload()">Попробовать снова</button>
    </main>
  </body>
</html>
